<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Details — WasteMart</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <svg class="brand-logo-icon" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="16" fill="#10b981"/>
          <path d="M16 8C22 8 25 13 25 18C25 24 20 25 15 25C10 25 8 21 8 16C8 11 11 8 16 8Z" fill="#ffffff"/>
          <path d="M13 21C16 17 19 14 23 11" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Waste<span>Mart</span>
      </a>

      <nav class="nav-menu" id="mainNav"></nav>

      <button class="mobile-menu-btn" onclick="toggleMobileNav()" aria-label="Toggle navigation">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-backdrop" id="mobileBackdrop" onclick="toggleMobileNav()"></div>
  <div class="mobile-drawer" id="mobileDrawer">
    <div class="mobile-drawer-header">
      <span class="brand-logo">Waste<span>Mart</span></span>
      <button class="mobile-drawer-close" onclick="toggleMobileNav()">&times;</button>
    </div>
    <nav class="mobile-nav-links" id="mobileNavLinks"></nav>
  </div>

  <main class="py-6">
    <div class="container" id="productDetailContainer">
      <!-- Injected via js/products.js renderProductDetailPage() -->
    </div>
  </main>

  <!-- Contact Seller Modal -->
  <div class="modal-overlay" id="contactSellerModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Contact Recycler / Seller</h3>
        <button class="modal-close-btn" onclick="closeModal('contactSellerModal')">&times;</button>
      </div>
      <form id="contactSellerForm" onsubmit="handleContactSellerSubmit(event)">
        <div class="modal-body" id="contactSellerModalBody">
          <!-- Injected via js/products.js openContactSellerModal() -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-sm" onclick="closeModal('contactSellerModal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Send Inquiry</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 WasteMart — "Turn Waste Into Value". All rights reserved.</p>
        <p><a href="shop.html" class="text-green">Back to Marketplace</a></p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderProductDetailPage();
    });
  </script>
</body>
</html>
