<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Waste Materials — WasteMart</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <svg class="brand-logo-icon" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="16" fill="#10b981"/>
          <path d="M16 8C22 8 25 13 25 18C25 24 20 25 15 25C10 25 8 21 8 16C8 11 11 8 16 8Z" fill="#ffffff"/>
          <path d="M13 21C16 17 19 14 23 11" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Waste<span>Mart</span>
      </a>

      <nav class="nav-menu" id="mainNav"></nav>

      <button class="mobile-menu-btn" onclick="toggleMobileNav()" aria-label="Toggle navigation">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-backdrop" id="mobileBackdrop" onclick="toggleMobileNav()"></div>
  <div class="mobile-drawer" id="mobileDrawer">
    <div class="mobile-drawer-header">
      <span class="brand-logo">Waste<span>Mart</span></span>
      <button class="mobile-drawer-close" onclick="toggleMobileNav()">&times;</button>
    </div>
    <nav class="mobile-nav-links" id="mobileNavLinks"></nav>
  </div>

  <main class="py-6">
    <div class="container">
      <!-- Breadcrumb & Header -->
      <div class="breadcrumbs">
        <a href="index.html">Home</a> &gt; <span>Browse Waste Materials</span>
      </div>
      <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 class="text-2xl font-bold">Browse Waste Materials</h1>
          <p class="text-muted text-sm" id="productCountText">Showing materials</p>
        </div>
        <a href="sell.html" class="btn btn-primary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          List New Waste
        </a>
      </div>

      <!-- Search & Filters Toolbar -->
      <div class="shop-toolbar">
        <div class="shop-search-bar">
          <div class="search-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="shopSearchInput" class="search-input" placeholder="Search waste materials by name, category, location, seller...">
          </div>
        </div>

        <div class="shop-filter-row">
          <!-- Category Filter Pills -->
          <div class="category-filter-pills" id="categoryFilterPills">
            <button type="button" class="category-filter-btn active" data-category="All">All</button>
            <button type="button" class="category-filter-btn" data-category="Plastic">Plastic</button>
            <button type="button" class="category-filter-btn" data-category="Paper">Paper</button>
            <button type="button" class="category-filter-btn" data-category="Metal">Metal</button>
            <button type="button" class="category-filter-btn" data-category="Glass">Glass</button>
            <button type="button" class="category-filter-btn" data-category="E-Waste">E-Waste</button>
            <button type="button" class="category-filter-btn" data-category="Cardboard">Cardboard</button>
            <button type="button" class="category-filter-btn" data-category="Rubber">Rubber</button>
            <button type="button" class="category-filter-btn" data-category="Textile">Textile</button>
          </div>

          <!-- Sort and Location Controls -->
          <div class="shop-sort-controls">
            <select id="shopLocationSelect" class="form-select">
              <option value="All">All Locations</option>
            </select>

            <select id="shopSortSelect" class="form-select">
              <option value="newest">Newest First</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="quantity-high">Highest Quantity</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="product-grid" id="shopProductsGrid">
        <!-- Injected via js/products.js -->
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 WasteMart — "Turn Waste Into Value". All rights reserved.</p>
        <p><a href="index.html" class="text-green">Back to Home</a></p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initShopPage();
    });
  </script>
</body>
</html>
