<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — WasteMart</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <svg class="brand-logo-icon" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="16" fill="#10b981"/>
          <path d="M16 8C22 8 25 13 25 18C25 24 20 25 15 25C10 25 8 21 8 16C8 11 11 8 16 8Z" fill="#ffffff"/>
          <path d="M13 21C16 17 19 14 23 11" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Waste<span>Mart</span>
      </a>

      <nav class="nav-menu" id="mainNav"></nav>

      <button class="mobile-menu-btn" onclick="toggleMobileNav()" aria-label="Toggle navigation">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-backdrop" id="mobileBackdrop" onclick="toggleMobileNav()"></div>
  <div class="mobile-drawer" id="mobileDrawer">
    <div class="mobile-drawer-header">
      <span class="brand-logo">Waste<span>Mart</span></span>
      <button class="mobile-drawer-close" onclick="toggleMobileNav()">&times;</button>
    </div>
    <nav class="mobile-nav-links" id="mobileNavLinks"></nav>
  </div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p class="text-muted text-sm">Sign in to your WasteMart account</p>
      </div>

      <!-- Quick Demo Account Switcher -->
      <div class="demo-credentials-box">
        <h4>Demo Quick Fill</h4>
        <div class="demo-buttons-grid">
          <button type="button" class="demo-fill-btn" onclick="setDemoCredentials('buyer')">
            🛒 Buyer Demo
          </button>
          <button type="button" class="demo-fill-btn" onclick="setDemoCredentials('seller')">
            🏭 Seller Demo
          </button>
          <button type="button" class="demo-fill-btn" onclick="setDemoCredentials('admin')">
            🛡️ Admin Demo
          </button>
        </div>
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. buyer@greenfuture.com" required>
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center mb-1">
            <label class="form-label mb-0" for="password">Password</label>
            <span class="text-xs text-muted">Demo mode</span>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="text-sm text-muted">
          Don't have an account? <a href="register.html" class="text-green font-semibold">Register here</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 WasteMart — "Turn Waste Into Value". All rights reserved.</p>
        <p><a href="index.html" class="text-green">Back to Home</a></p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('reason') === 'unauthorized') {
        showToast('Please log in to access this page.', 'warning');
      }
    });

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const result = loginUser(email, password);
      if (!result.success) {
        showToast(result.message, 'error');
        return;
      }

      showToast(`Welcome, ${result.user.name}!`, 'success');
      setTimeout(() => {
        const redirect = sessionStorage.getItem('redirectAfterLogin');
        if (redirect) {
          sessionStorage.removeItem('redirectAfterLogin');
          window.location.href = redirect;
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 800);
    }
  </script>
</body>
</html>
