<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account — WasteMart</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <svg class="brand-logo-icon" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="16" fill="#10b981"/>
          <path d="M16 8C22 8 25 13 25 18C25 24 20 25 15 25C10 25 8 21 8 16C8 11 11 8 16 8Z" fill="#ffffff"/>
          <path d="M13 21C16 17 19 14 23 11" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Waste<span>Mart</span>
      </a>

      <nav class="nav-menu" id="mainNav"></nav>

      <button class="mobile-menu-btn" onclick="toggleMobileNav()" aria-label="Toggle navigation">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-backdrop" id="mobileBackdrop" onclick="toggleMobileNav()"></div>
  <div class="mobile-drawer" id="mobileDrawer">
    <div class="mobile-drawer-header">
      <span class="brand-logo">Waste<span>Mart</span></span>
      <button class="mobile-drawer-close" onclick="toggleMobileNav()">&times;</button>
    </div>
    <nav class="mobile-nav-links" id="mobileNavLinks"></nav>
  </div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Join WasteMart</h2>
        <p class="text-muted text-sm">Create an account to trade waste materials</p>
      </div>

      <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name / Business Name *</label>
          <input type="text" id="regName" class="form-input" placeholder="e.g. Anand Scrap Works" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address *</label>
          <input type="email" id="regEmail" class="form-input" placeholder="e.g. anand@recycle.in" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPhone">Phone Number</label>
          <input type="tel" id="regPhone" class="form-input" placeholder="+91 98765 00000">
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password *</label>
          <input type="password" id="regPassword" class="form-input" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regUserType">I want to register as *</label>
          <select id="regUserType" class="form-select-full" required>
            <option value="buyer">Buyer (Purchase scrap &amp; recyclable materials)</option>
            <option value="seller">Seller (List waste, factory scrap &amp; recyclables)</option>
          </select>
        </div>

        <p class="text-xs text-muted mb-4">
          Note: This educational demo stores registered user profiles in your browser's LocalStorage.
        </p>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          Create Account
        </button>
      </form>

      <div class="text-center mt-4">
        <p class="text-sm text-muted">
          Already have an account? <a href="login.html" class="text-green font-semibold">Log in</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 WasteMart — "Turn Waste Into Value". All rights reserved.</p>
        <p><a href="index.html" class="text-green">Back to Home</a></p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/main.js"></script>
  <script>
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const userType = document.getElementById('regUserType').value;

      const result = registerUser(name, email, phone, password, userType);
      if (!result.success) {
        showToast(result.message, 'error');
        return;
      }

      showToast('Account registered successfully! Welcome to WasteMart.', 'success');
      setTimeout(() => {
        window.location.href = userType === 'seller' ? 'sell.html' : 'shop.html';
      }, 1000);
    }
  </script>
</body>
</html>
